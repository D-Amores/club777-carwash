[project]
name = "club777-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amores", email = "amores.dev@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
club777-api = "club777_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
